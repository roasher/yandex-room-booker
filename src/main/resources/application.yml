spring:
  application:
    name: yandex-room-booker
  config:
    import: classpath:rooms.yml

room-booker:
  enabled: false
  api-base-url: https://cloud-api.yandex.net
  time-zone: Europe/Moscow
  meeting-name: ""
  room: ""
  room-email: ""
  start: ""
  duration: ""
  oauth-token: ${YANDEX_CALENDAR_OAUTH_TOKEN:}
  booking-open-buffer: 0s
  booking-max-retries: 120
  booking-retry-backoff: 1s
  booking-retry-multiplier: 1
