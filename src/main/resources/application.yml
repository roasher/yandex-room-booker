logging:
  level:
    root: INFO
    ru.yandex.roombooker: DEBUG
  file:
    name: logs/spring.log
  pattern:
    # Keep plain timestamps in files; console uses Spring Boot's default colored pattern.
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"

spring:
  application:
    name: yandex-room-booker
  config:
    import: classpath:rooms.yml

room-booker:
  enabled: false
  # api = Public Calendar API; browser = web UI API. Selects ApiRoomBookerProperties or BrowserRoomBookerProperties.
  booking-mode: ${ROOM_BOOKER_BOOKING_MODE:api}
  time-zone: Europe/Moscow
  meeting-name: ""
  room: ""
  room-email: ""
  start: ""
  duration: ""
  # Delay after bookable-ahead opens (Calendar often rejects the exact open second).
  # Retries still cover residual clock skew via "not bookable" → retryable attach.
  booking-open-buffer: 90s
  # Progressive booking: walk held slot toward target in this step.
  slot-shift-step: 30m
  booking-max-retries: 20
  booking-retry-backoff: 1s
  booking-retry-multiplier: 1
  # api mode
  api-base-url: https://cloud-api.yandex.net
  oauth-token: ${YANDEX_CALENDAR_OAUTH_TOKEN:}
  # browser mode (cookie-only auth; ckey/uid resolved at runtime)
  web-base-url: https://calendar.yandex-team.ru
  cookies: ${YANDEX_CALENDAR_COOKIES:}
